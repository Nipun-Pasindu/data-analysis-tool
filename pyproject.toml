[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-analysis-tool"
version = "0.1.0"
description = "A robust Python toolkit designed for data cleaning, exploration, and interactive visualization within Google Colab."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "e/23/210", email = "nipunpasindu276@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: Jupyter",
]
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
plotting = [
    "plotly>=5.0.0",
    "statsmodels>=0.13.0"
]
